<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevOps Kanban Board - Manage tasks smoothly across To Do, In Progress, and Done stages with real-time PostgreSQL & FastAPI sync.">
  <title>DevFlow Kanban Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <!-- App Wrapper -->
  <div class="app-container">
    
    <!-- Top Navigation Bar -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>DevFlow Kanban</h1>
          <span class="brand-subtitle">DevOps Task Management</span>
        </div>
      </div>

      <!-- Stats Bar & Status -->
      <div class="header-center">
        <div class="status-indicator" id="connection-status" title="Checking backend health...">
          <span class="status-dot"></span>
          <span class="status-label" id="status-label">Connecting...</span>
        </div>
        <div class="task-stats">
          <div class="stat-item" title="Total Tasks">
            <span class="stat-count" id="stat-total">0</span>
            <span class="stat-name">Total</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item stat-todo">
            <span class="stat-count" id="stat-todo">0</span>
            <span class="stat-name">To Do</span>
          </div>
          <div class="stat-item stat-in-progress">
            <span class="stat-count" id="stat-progress">0</span>
            <span class="stat-name">Progress</span>
          </div>
          <div class="stat-item stat-done">
            <span class="stat-count" id="stat-done">0</span>
            <span class="stat-name">Done</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="header-actions">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search tasks..." aria-label="Search tasks">
        </div>
        <button id="btn-add-task" class="btn btn-primary" aria-label="Add new task">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Task</span>
        </button>
      </div>
    </header>

    <!-- Main Kanban Columns Board -->
    <main class="board-container">
      <!-- Column: To Do -->
      <section class="kanban-column" id="column-todo" data-status="To Do">
        <div class="column-header column-header-todo">
          <div class="col-title-group">
            <span class="col-indicator"></span>
            <h2>To Do</h2>
            <span class="col-badge" id="count-todo">0</span>
          </div>
          <button class="col-quick-add" id="btn-quick-todo" title="Add task to To Do" aria-label="Add task to To Do">+</button>
        </div>
        <div class="task-list" id="task-list-todo" data-status="To Do">
          <!-- Task cards dynamically injected here -->
        </div>
      </section>

      <!-- Column: In Progress -->
      <section class="kanban-column" id="column-progress" data-status="In Progress">
        <div class="column-header column-header-progress">
          <div class="col-title-group">
            <span class="col-indicator"></span>
            <h2>In Progress</h2>
            <span class="col-badge" id="count-progress">0</span>
          </div>
          <button class="col-quick-add" id="btn-quick-progress" title="Add task to In Progress" aria-label="Add task to In Progress">+</button>
        </div>
        <div class="task-list" id="task-list-progress" data-status="In Progress">
          <!-- Task cards dynamically injected here -->
        </div>
      </section>

      <!-- Column: Done -->
      <section class="kanban-column" id="column-done" data-status="Done">
        <div class="column-header column-header-done">
          <div class="col-title-group">
            <span class="col-indicator"></span>
            <h2>Done</h2>
            <span class="col-badge" id="count-done">0</span>
          </div>
          <button class="col-quick-add" id="btn-quick-done" title="Add task to Done" aria-label="Add task to Done">+</button>
        </div>
        <div class="task-list" id="task-list-done" data-status="Done">
          <!-- Task cards dynamically injected here -->
        </div>
      </section>
    </main>
  </div>

  <!-- Task Modal (Create & Edit) -->
  <div class="modal-overlay" id="task-modal" aria-hidden="true" role="dialog" aria-labelledby="modal-heading">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-heading">Create New Task</h3>
        <button class="modal-close" id="btn-close-modal" aria-label="Close modal">&times;</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id-input">
        <div class="form-group">
          <label for="task-title-input">Task Title <span class="required">*</span></label>
          <input type="text" id="task-title-input" placeholder="e.g., Set up PostgreSQL replication" required maxlength="255">
        </div>
        <div class="form-group">
          <label for="task-desc-input">Description</label>
          <textarea id="task-desc-input" rows="4" placeholder="Add technical details, acceptance criteria, or notes..."></textarea>
        </div>
        <div class="form-group">
          <label for="task-status-select">Status / Column</label>
          <select id="task-status-select">
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-task">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Application Logic -->
  <script src="board.js"></script>
</body>
</html>
