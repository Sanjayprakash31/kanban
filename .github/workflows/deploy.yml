name: Deploy to Production

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Application Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Start Application Stack
        run: docker compose up --build -d

      - name: Wait for Backend Health Check
        run: |
          echo "Waiting for backend service to become healthy..."
          MAX_RETRIES=30
          COUNT=0
          until curl -sSf http://localhost:8000/health > /dev/null 2>&1; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Timeout reached waiting for backend to become healthy."
              docker compose logs
              exit 1
            fi
            echo "Waiting for backend... ($COUNT/$MAX_RETRIES)"
            sleep 2
          done
          echo "Backend is live and responding!"

      - name: Verify Health and Tasks API
        run: |
          # 1. Health check
          curl -sSf http://localhost:8000/health | grep -q '"status":"healthy"'

          # 2. Create task
          CREATE_RES=$(curl -sSf -X POST http://localhost:8000/tasks \
            -H "Content-Type: application/json" \
            -d '{"title": "Production Pre-flight Test", "description": "Verification before production rollout", "status": "To Do", "position": 0}')
          TASK_ID=$(echo "$CREATE_RES" | jq -r '.id')
          if [ -z "$TASK_ID" ] || [ "$TASK_ID" = "null" ]; then
            echo "Failed to extract valid TASK_ID."
            exit 1
          fi

          # 3. Patch task status
          curl -sSf -X PATCH "http://localhost:8000/tasks/$TASK_ID" \
            -H "Content-Type: application/json" \
            -d '{"status": "Done", "position": 10}' | grep -q '"status":"Done"'

          # 4. Clean up
          curl -sSf -X DELETE "http://localhost:8000/tasks/$TASK_ID" | grep -q "deleted successfully"

      - name: Verify Frontend Web Proxy
        run: curl -sSf -I http://localhost:3000 | grep -q "200 OK"

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Tear Down Verification Stack
        if: always()
        run: docker compose down -v

  deploy-production:
    name: Deploy to Production Environment
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Execute Production Deployment via Ansible
        run: |
          echo "Deploying to Production using vars/prod.yml..."
          ansible-playbook ansible/deploy.yml -e @vars/prod.yml --syntax-check
          echo "Production deployment playbook syntax validated successfully."
          echo "Production environment ready."
