name: CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Docker Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Start Application Stack
        run: docker compose up --build -d

      - name: Wait for Backend Health Check
        run: |
          echo "Waiting for backend service to become healthy..."
          MAX_RETRIES=30
          COUNT=0
          until curl -sSf http://localhost:8000/health > /dev/null 2>&1; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Timeout reached waiting for backend to become healthy."
              docker compose logs
              exit 1
            fi
            echo "Waiting for backend... ($COUNT/$MAX_RETRIES)"
            sleep 2
          done
          echo "Backend is live and responding!"

      - name: Verify Health and Tasks API
        run: |
          echo "1. Verifying health endpoint..."
          curl -sSf http://localhost:8000/health | grep -q '"status":"healthy"'

          echo "2. Testing task creation..."
          CREATE_RES=$(curl -sSf -X POST http://localhost:8000/tasks \
            -H "Content-Type: application/json" \
            -d '{"title": "CD Pipeline Automated Verification", "description": "Verification task before release", "status": "To Do"}')
          TASK_ID=$(echo "$CREATE_RES" | jq -r '.id')
          if [ -z "$TASK_ID" ] || [ "$TASK_ID" = "null" ]; then
            echo "Failed to extract valid TASK_ID from response."
            exit 1
          fi
          echo "Created Task ID: $TASK_ID"

          echo "3. Testing task update..."
          curl -sSf -X PUT "http://localhost:8000/tasks/$TASK_ID" \
            -H "Content-Type: application/json" \
            -d '{"status": "Done"}' | grep -q '"status":"Done"'

          echo "4. Testing task deletion..."
          curl -sSf -X DELETE "http://localhost:8000/tasks/$TASK_ID" | grep -q "deleted successfully"

      - name: Verify Frontend Accessibility
        run: curl -sSf -I http://localhost:3000 | grep -q "200 OK"

      - name: Dump Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Tear Down Verification Stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy Kanban Application
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deployment Execution
        run: |
          echo "============================================="
          echo "CI verification passed successfully."
          echo "Kanban application is ready for deployment."
          echo "============================================="
