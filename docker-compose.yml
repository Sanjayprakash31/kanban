services:
  # =========================================================
  # PostgreSQL Database Service
  # =========================================================
  db:
    image: postgres:15-alpine
    container_name: kanban_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanban_db
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: kanban_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================
  # FastAPI Backend Service
  # =========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://kanban_user:kanban_password@db:5432/kanban_db
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: kanban_db
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: kanban_password
    depends_on:
      db:
        condition: service_healthy

  # =========================================================
  # Frontend Web Service (Nginx)
  # =========================================================
  frontend:
    image: nginx:alpine
    container_name: kanban_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

# =========================================================
# Persistent Volumes
# =========================================================
volumes:
  postgres_data:
    driver: local
